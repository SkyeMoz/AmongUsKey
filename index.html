<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Password Steps</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: 'Segoe UI', sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background: linear-gradient(135deg,#0f172a,#1e293b,#020617);
  color:white;
}

/* Glass Card */
.card{
  width:400px;
  max-width:90%;
  padding:30px;
  border-radius:22px;
  background:rgba(255,255,255,0.07);
  backdrop-filter: blur(25px);
  border:1px solid rgba(255,255,255,0.15);
  box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  text-align:center;
}

h1{
  margin-bottom:20px;
  font-size:22px;
  font-weight:600;
}

/* Buttons */
button{
  width:100%;
  padding:13px;
  margin-top:12px;
  border:none;
  border-radius:14px;
  font-weight:600;
  cursor:pointer;
  transition: all .25s ease;
  font-size:14px;
}

.start{
  background: linear-gradient(90deg,#00ffa3,#00c6ff);
  color:black;
}

.start:hover{
  transform:scale(1.04);
  box-shadow:0 0 20px rgba(0,255,163,0.4);
}

.uidBtn{
  background: rgba(255,255,255,0.08);
  color:white;
  border:1px solid rgba(255,255,255,0.15);
}

.uidBtn:hover{
  background: rgba(255,255,255,0.15);
}

/* Toast */
.toast{
  position:fixed;
  bottom:25px;
  left:50%;
  transform:translateX(-50%);
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(10px);
  padding:12px 18px;
  border-radius:14px;
  font-size:13px;
  opacity:0;
  transition:.3s;
}

.toast.show{
  opacity:1;
}
</style>
</head>

<body>

<div class="card">
  <h1>Verification (MozLaunch)</h1>

  <button class="start" onclick="copyStart()">
    Start Verification
  </button>

  <button class="uidBtn" onclick="copyUID()">
    Copy UID
  </button>
</div>

<div class="toast" id="toast">Copied!</div>

<script>
const toast = document.getElementById("toast");

const UID = "UID-7f3c9a1b6e4d2c8f91a0d5b3e7c6f8a2d9b1c4e6f0a8d3c5b7e1f9a2d4c6b8e0f1a3c5d7b9e2f4a6c8d0b2e4f6a8c1d3b5e7f9a0c2d4b6e8f1a3c5d7b9e0f2a4c6d8b1e3f5a7c9d0b2e4f6a8c0";

function showToast(text){
  toast.innerText = text;
  toast.classList.add("show");
  setTimeout(()=>toast.classList.remove("show"), 1500);
}

// fallback copy method
function fallbackCopy(text){
  const textarea = document.createElement("textarea");
  textarea.value = text;
  document.body.appendChild(textarea);
  textarea.select();
  document.execCommand("copy");
  document.body.removeChild(textarea);
}

async function copyText(text){
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      fallbackCopy(text);
    }
    return true;
  } catch (e) {
    console.log("Copy failed:", e);
    fallbackCopy(text);
    return false;
  }
}

async function copyStart(){
  await copyText("https://ouo.io/qA6vsn");
  showToast("Link copied!");
}

async function copyUID(){
  const ok = await copyText(UID);
  showToast(ok ? "UID copied!" : "Copied (fallback used)");
}
</script>

</body>
</html>
