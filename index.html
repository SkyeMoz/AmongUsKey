<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Key Verification (Among Us Vip)</title>
<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, Helvetica, sans-serif;
    }body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    overflow:hidden;
}

.background-blobs{
    position:absolute;
    width:100%;
    height:100%;
    overflow:hidden;
    z-index:-1;
}

.blob{
    position:absolute;
    width:300px;
    height:300px;
    background: rgba(0, 255, 200, 0.2);
    border-radius:50%;
    filter: blur(80px);
    animation: float 10s infinite ease-in-out;
}

.blob:nth-child(2){
    top:20%;
    left:60%;
    background: rgba(255, 0, 150, 0.2);
}

.blob:nth-child(3){
    top:60%;
    left:20%;
    background: rgba(0, 120, 255, 0.2);
}

@keyframes float{
    0%,100%{transform: translateY(0px);}
    50%{transform: translateY(-40px);}
}

.card{
    width:350px;
    padding:30px;
    border-radius:20px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(20px);
    border:1px solid rgba(255,255,255,0.2);
    text-align:center;
    color:white;
    box-shadow:0 8px 32px rgba(0,0,0,0.3);
}

h1{
    font-size:20px;
    margin-bottom:10px;
}

p{
    font-size:13px;
    opacity:0.8;
    margin-bottom:20px;
    line-height:1.4;
}

.info{
    font-size:12px;
    margin-bottom:20px;
    opacity:0.7;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    background: linear-gradient(90deg, #00ffa3, #00b3ff);
    color:black;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform: scale(1.05);
}

</style>
</head>
<body><div class="background-blobs">
    <div class="blob" style="top:10%; left:10%;"></div>
    <div class="blob"></div>
    <div class="blob"></div>
</div><div class="card">
    <h1>Key Verification (Among Us Vip)</h1>
    <p>
        Welcome to the VIP Key System. Generate a key to unlock premium access features.
        This system ensures secure and limited access.
    </p>
    <div class="info">
        ⏳ Expiration: 62 hours per key<br/>
        🔐 Secure verification required
    </div>
    <button onclick="generateKey()">Generate Key</button>
</div><script>
function generateKey(){
    // redirect to your website here
    window.location.href = "https://tpi.li/psdPYruEo";
}
</script></body>
</html>
