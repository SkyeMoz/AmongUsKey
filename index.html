<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Key Verification (Among Us Vip)</title>

<style>
  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
  }

  body{
    min-height:100vh;
    display:grid;
    place-items:center;
    background:linear-gradient(135deg,#0b1220,#111b2e);
    color:white;
  }

  .card{
    width:420px;
    max-width:92vw;
    padding:28px;
    border-radius:20px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.15);
    text-align:center;
  }

  h1{margin-bottom:10px;}

  .uid-box{
    margin:15px 0;
    padding:12px;
    border-radius:14px;
    background:rgba(255,255,255,0.06);
    font-size:12px;
    word-break:break-all;
    text-align:left;
  }

  button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:12px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
  }

  .start{
    background:linear-gradient(90deg,#00ffa3,#00b3ff);
    color:black;
  }

  .uidBtn{
    background:rgba(255,255,255,0.1);
    color:white;
  }

  button:hover{transform:scale(1.03);}

  .toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:#111;
    padding:10px 16px;
    border-radius:12px;
    font-size:13px;
    opacity:0;
    transition:.25s;
  }

  .toast.show{
    opacity:1;
  }
</style>
</head>

<body>

<div class="card">
  <h1>Key Verification (Among Us Vip)</h1>

  <div class="uid-box" id="uidText">
UID-7f3c9a1b6e4d2c8f91a0d5b3e7c6f8a2d9b1c4e6f0a8d3c5b7e1f9a2d4c6b8e0f1a3c5d7b9e2f4a6c8d0b2e4f6a8c1d3b5e7f9a0c2d4b6e8f1a3c5d7b9e0f2a4c6d8b1e3f5a7c9d0b2e4f6a8c0
  </div>

  <button class="start" onclick="copyStart()">
    Start
  </button>

  <button class="uidBtn" onclick="copyUID()">
    Get UID
  </button>
</div>

<div class="toast" id="toast">Copied!</div>

<script>
const toast = document.getElementById("toast");

function showToast(text){
  toast.innerText = text;
  toast.classList.add("show");
  setTimeout(()=>toast.classList.remove("show"), 1500);
}

async function copyText(text){
  try{
    await navigator.clipboard.writeText(text);
    return true;
  }catch(e){
    return false;
  }
}

// START button → copies OUO link
function copyStart(){
  copyText("https://ouo.io/qA6vsn");
  showToast("Link copied!");
}

// UID button → copies UID
function copyUID(){
  const uid = document.getElementById("uidText").innerText.trim();
  copyText(uid);
  showToast("UID copied!");
}
</script>

</body>
</html>
